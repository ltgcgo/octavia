name: Validate multiple runtimes

on:
  # Runs on pushes targeting the working branches
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/validateRt.yml"
      - "libs/**"
      - "sh/build.sh"
      - "sh/validate.sh"
      - "sh/validatorSetup.sh"
      - "src/chord/**"
      - "src/data/**"
      - "src/flyLeaf/**"
      - "src/micc/**"
      - "!src/**/*.d.mts"
      - "!src/**/*.md"
      - "validate/runtimes/**"
  # Runs on pull requests targeting the working branches
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - review_requested
    branches:
      - "main"
    paths:
      - ".github/workflows/validateRt.yml"
      - "libs/**"
      #- "sh/build.sh"
      - "sh/validate.sh"
      - "sh/validatorSetup.sh"
      - "src/chord/**"
      - "src/data/**"
      - "src/flyLeaf/**"
      - "src/micc/**"
      - "!src/**/*.d.mts"
      - "!src/**/*.md"
      - "validate/runtimes/**"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "validator.runtime"
  cancel-in-progress: true


jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: Show Deno version
        run: "deno --version"
      - name: Setup Ende
        run: "./shx setup/ende"
      - name: Show Ende version
        run: "ende --version"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Show Bun version
        run: "bun --version"
      - name: Setup Node.js (eugh, disgusting)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Show Node.js version (eugh, disgusting)
        run: "node --version"
      - name: Generate data for Octavia
        run: "./shx generate"
      #- name: Build Octavia files
      #  run: "./shx build"
      - name: Configure the validator environment
        run: "./shx validatorSetup"
      - name: Create cache directory
        run: |
          mkdir -p ./cache/validate/MICC.MICC_parseSmf/deno
          mkdir -p ./cache/validate/MICC.MICC_parseSmf/ende
          mkdir -p ./cache/validate/MICC.MICC_parseSmf/bun
          mkdir -p ./cache/validate/MICC.MICC_parseSmf/node
      - name: Generate Deno proof
        run: "deno run --preload ./src/flyLeaf/loader/index.mjs --allow-read --allow-write --allow-env ./validate/runtimes/emit.mjs"
      - name: Generate Ende proof
        run: "ende run --preload ./src/flyLeaf/loader/index.mjs --allow-read --allow-write --allow-env ./validate/runtimes/emit.mjs"
      - name: Generate Bun proof
        env:
          VERGILIUS_PRINT_TRACE: 3
          VERGILIUS_PRINT_PROXY: 1
          VERGILIUS_PRINT_STACK: 1
        run: "bun run --preload ./src/flyLeaf/loader/index.mjs ./validate/runtimes/emit.mjs"
      - name: Generate Node proof (eugh, disgusting)
        env:
          VERGILIUS_PRINT_TRACE: 3
          VERGILIUS_PRINT_PROXY: 1
          VERGILIUS_PRINT_STACK: 1
        run: "node --import ./src/flyLeaf/loader/index.mjs ./validate/runtimes/emit.mjs"
      - name: Move the proof
        run: "mv -v ./cache/validate ./proof"
      - name: Generate summary
        run: "bash ./validate/runtimes/summary.sh"
      - name: Upload generated proof
        uses: actions/upload-artifact@v7
        with:
          name: validator-proof
          path: ./proof/**